name: Build HR Chase v0.19.1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract HR Chase v0.19.1
        run: |
          unzip -o HRChase-v0.19.1-Upcoming-Playoff-Games.zip
          chmod +x HRChase/gradlew

      - name: Build debug APK
        working-directory: HRChase
        run: ./gradlew assembleDebug

