name: Build HR Chase v0.19.5 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract HR Chase v0.19.5
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -o HRChase-v0.19.5-All-Teams-Hitters-Fix.zip -d build-project
          echo "=== PROJECT CONTENTS ==="
          find build-project -maxdepth 3 -type f | head -100

      - name: Make Gradle executable
        run: chmod +x build-project/HRChase/gradlew

      - name: Build HR Chase v0.19.5
        working-directory: build-project/HRChase
        run: ./
