name: Build HR Chase v0.19.5 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract HR Chase v0.19.5
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -o HRChase-v0.19.5-All-Teams-Hitters-Fix.zip -d build-project
          echo "=== VERIFY PROJECT ==="
          ls -la build-project/HRChase
          ls -la build-project/HRChase/gradlew

      - name: Build HR Chase v0.19.5
        run: |
          chmod +x "$GITHUB_WORKSPACE/build-project/HRChase/gradlew"
          cd "$GITHUB_WORKSPACE/build-project/HRChase"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HRChase-v0.19.5-APK
          path: build-project/HRChase/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
