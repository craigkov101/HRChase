name: Build HR Chase v0.19.4 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract HR Chase v0.19.4
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -o HRChase-v0.19.4-Two-Team-Hitters-Fix.zip -d build-project
          echo "=== PROJECT CONTENTS ==="
          find build-project -maxdepth 3 -type f | head -
